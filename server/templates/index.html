<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AI DVR - نظام المراقبة</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--card:#1c2333;--border:#30363d;--accent:#00d4ff;--accent2:#2ea043;--red:#da3633;--orange:#d29922;--text:#c9d1d9;--text2:#8b949e;--hover:#21262d}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
input,select,button{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* LOGIN */
.login-page{display:flex;height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d1117 0%,#1a2332 50%,#0d1117 100%)}
.login-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:40px;width:380px;text-align:center;box-shadow:0 0 40px rgba(0,212,255,.08)}
.login-box .logo{font-size:36px;margin-bottom:8px}
.login-box h1{font-size:18px;color:var(--accent);margin-bottom:4px}
.login-box p{font-size:12px;color:var(--text2);margin-bottom:28px}
.login-box input{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;margin-bottom:12px;outline:none;transition:border .2s}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;padding:12px;background:var(--accent);color:#000;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s}
.login-box button:hover{opacity:.9}
.login-box .error{color:var(--red);font-size:12px;margin-top:10px}

/* MAIN LAYOUT */
.app{display:none;flex-direction:column;height:100vh}
.top-bar{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-bottom:1px solid var(--border);padding:0 16px;height:48px;flex-shrink:0}
.top-bar .logo-area{display:flex;align-items:center;gap:12px}
.top-bar .logo-icon{width:28px;height:28px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#000}
.top-bar .logo-text{font-weight:600;font-size:14px;color:var(--accent)}
.top-bar .mode-tabs{display:flex;gap:4px;background:var(--bg);border-radius:6px;padding:3px}
.top-bar .mode-tab{padding:6px 18px;border:none;background:transparent;color:var(--text2);font-size:12px;border-radius:4px;cursor:pointer}
.top-bar .mode-tab.active{background:var(--card);color:var(--accent)}
.top-bar .top-right{display:flex;align-items:center;gap:16px}
.top-bar .top-clock{font-size:12px;color:var(--text2);direction:ltr}
.top-bar .top-user{font-size:12px;color:var(--accent);cursor:pointer}
.top-bar .top-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer}

/* MAIN CONTENT */
.main-content{display:flex;flex:1;overflow:hidden}

/* CAMERA GRID */
.camera-area{flex:1;position:relative;background:#000;overflow:hidden}
.grid-container{width:100%;height:100%;display:grid;gap:2px;padding:2px}
.grid-container.layout-1x1{grid-template-columns:1fr}
.grid-container.layout-2x2{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.grid-container.layout-3x3{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr}
.grid-container.layout-4x4{grid-template-columns:1fr 1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr 1fr}
.cell{position:relative;background:#0a0a0a;overflow:hidden;border-radius:2px}
.cell img{width:100%;height:100%;object-fit:cover}
.cell .overlay{position:absolute;top:0;left:0;right:0;padding:4px 8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.cell .cam-name{background:rgba(0,0,0,.7);color:var(--accent);padding:2px 8px;border-radius:3px;font-size:11px}
.cell .rec-indicator{display:none;align-items:center;gap:4px;background:rgba(218,54,51,.8);padding:2px 8px;border-radius:3px;font-size:10px;color:#fff}
.cell .rec-indicator.show{display:flex}
.cell .rec-dot{width:6px;height:6px;background:#fff;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.cell .offline-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:var(--text2);font-size:13px}
.cell .offline-msg span{background:var(--panel);padding:8px 16px;border-radius:6px;border:1px solid var(--border)}
.cell .fps-badge{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.7);color:var(--text2);padding:1px 6px;border-radius:2px;font-size:10px;pointer-events:none}
.cell .ai-badge{position:absolute;bottom:4px;right:4px;background:rgba(0,212,255,.15);color:var(--accent);padding:1px 6px;border-radius:2px;font-size:10px;pointer-events:none}
.cell .ptz-overlay{position:absolute;bottom:50px;left:10px;display:none;pointer-events:all}
.cell .ptz-overlay.show{display:block}
.cell:hover .ptz-overlay{display:block}

/* PTZ */
.ptz-pad{background:rgba(0,0,0,.8);border:1px solid var(--border);border-radius:8px;padding:6px;width:130px}
.ptz-row{display:flex;justify-content:center;gap:4px;margin:2px 0}
.ptz-btn{width:34px;height:34px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ptz-btn:hover{background:var(--hover);border-color:var(--accent);color:var(--accent)}
.ptz-btn:active{background:var(--accent);color:#000}

/* SIDEBAR */
.sidebar{width:220px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:12px 14px;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.sidebar-header .layout-btns{display:flex;gap:3px}
.sidebar-header .layout-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:2px 6px;border-radius:3px;font-size:10px;cursor:pointer}
.sidebar-header .layout-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.cam-list{flex:1;overflow-y:auto;padding:4px 0}
.cam-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(48,54,61,.3);transition:background .15s}
.cam-item:hover{background:var(--hover)}
.cam-item.active{background:rgba(0,212,255,.1);border-right:3px solid var(--accent)}
.cam-item .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cam-item .status-dot.on{background:var(--accent2);box-shadow:0 0 6px var(--accent2)}
.cam-item .status-dot.off{background:var(--red)}
.cam-item .cam-item-name{font-size:13px;flex:1}
.cam-item .cam-item-info{font-size:10px;color:var(--text2)}

/* TIMELINE BAR */
.timeline-bar{background:var(--panel);border-top:1px solid var(--border);padding:8px 16px;flex-shrink:0}
.timeline-controls{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.timeline-controls button{background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer}
.timeline-controls button:hover{background:var(--hover);border-color:var(--accent)}
.timeline-controls button.active{background:var(--accent);color:#000;border-color:var(--accent)}
.timeline-controls .time-display{font-size:11px;color:var(--text2);direction:ltr;margin-left:auto}
.timeline-canvas-wrap{position:relative;height:40px;background:var(--bg);border-radius:4px;border:1px solid var(--border);overflow:hidden;cursor:pointer}
.timeline-canvas{width:100%;height:100%}
.timeline-time-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--text2);padding:2px 4px}
.timeline-time-labels span{width:40px;text-align:center}

/* SETTINGS MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;width:700px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:16px;color:var(--accent)}
.modal-header .close-btn{background:transparent;border:none;color:var(--text2);font-size:20px;cursor:pointer}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-body label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.modal-body input,.modal-body select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;margin-bottom:12px;outline:none}
.modal-body input:focus{border-color:var(--accent)}
.form-group{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-section{margin-bottom:20px}
.form-section h3{font-size:13px;color:var(--text);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border)}
.modal-footer button{padding:8px 20px;border-radius:4px;font-size:12px;cursor:pointer}
.modal-footer .btn-primary{background:var(--accent);color:#000;border:none;font-weight:600}
.modal-footer .btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text)}

/* EMPTY STATE */
.empty-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2)}
.empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-state p{font-size:14px}

/* RESPONSIVE */
@media(max-width:900px){.sidebar{width:160px}}
@media(max-width:700px){.sidebar{display:none}.modal{width:95%}}
</style>
</head>
<body>

<div class="login-page" id="loginPage">
  <div class="login-box">
    <div class="logo">🎥</div>
    <h1>AI DVR - نظام المراقبة</h1>
    <p>يرجى تسجيل الدخول</p>
    <form id="loginForm" method="post" action="/" onsubmit="return doLogin(event)">
      <input type="text" id="username" name="username" placeholder="اسم المستخدم" required>
      <input type="password" id="password" name="password" placeholder="كلمة السر" required>
      <button type="submit">دخول</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>
</div>

<div class="app" id="app">
  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="logo-area">
      <div class="logo-icon">AI</div>
      <span class="logo-text">AI DVR</span>
    </div>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="live" onclick="setMode('live')">مباشر</button>
      <button class="mode-tab" data-mode="playback" onclick="setMode('playback')">تسجيلات</button>
    </div>
    <div class="top-right">
      <span class="top-clock" id="topClock"></span>
      <button class="top-btn" onclick="showSystem()">📊 النظام</button>
      <span class="top-user" id="topUser" onclick="showSettings()">⚙️</span>
    </div>
  </div>

  <div class="main-content">
    <!-- CAMERA AREA -->
    <div class="camera-area" id="cameraArea">
      <div class="grid-container layout-2x2" id="gridContainer" data-layout="2x2"></div>
      <div class="empty-state" id="emptyState" style="display:none">
        <div class="icon">📹</div>
        <p>لا توجد كاميرات متاحة</p>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>الكاميرات</span>
        <div class="layout-btns">
          <button class="layout-btn" data-layout="1x1" onclick="setLayout('1x1')">1</button>
          <button class="layout-btn active" data-layout="2x2" onclick="setLayout('2x2')">4</button>
          <button class="layout-btn" data-layout="3x3" onclick="setLayout('3x3')">9</button>
          <button class="layout-btn" data-layout="4x4" onclick="setLayout('4x4')">16</button>
        </div>
      </div>
      <div class="cam-list" id="camList"></div>
    </div>
  </div>

  <!-- TIMELINE BAR (LIVE MODE) -->
  <div class="timeline-bar" id="liveTimeline">
    <div class="timeline-controls">
      <span style="font-size:11px;color:var(--text2)">📹 مباشر</span>
      <button onclick="takeSnapshot()">📸 تصوير</button>
      <button onclick="toggleFullscreen()">⛶ ملء الشاشة</button>
      <span class="time-display" id="liveTimeDisplay"></span>
    </div>
    <div class="timeline-time-labels">
      <span>00:00</span><span>04:00</span><span>08:00</span><span>12:00</span><span>16:00</span><span>20:00</span><span>24:00</span>
    </div>
  </div>

  <!-- TIMELINE BAR (PLAYBACK MODE) -->
  <div class="timeline-bar" id="playbackTimeline" style="display:none">
    <div class="timeline-controls">
      <input type="date" id="playbackDate" style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:11px">
      <button onclick="loadPlayback()">🔍 بحث</button>
      <span style="font-size:11px;color:var(--text2)" id="playbackCount"></span>
      <span class="time-display" id="playbackInfo" style="direction:rtl"></span>
    </div>
    <div style="overflow-x:auto;white-space:nowrap;padding:4px 0" id="recordingList"></div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h2>إعدادات النظام</h2>
      <button class="close-btn" onclick="closeSettings()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-section">
        <h3>الكاميرات</h3>
        <div id="cameraSettings"></div>
      </div>
      <div class="form-section">
        <h3>إعدادات التسجيل</h3>
        <div class="form-group">
          <div><label>وضع التسجيل</label><select id="cfgRecordingMode"><option value="motion">عند الحركة</option><option value="continuous">مستمر 24/7</option><option value="schedule">مجدول</option><option value="off">معطل</option></select></div>
          <div><label>حساسية الحركة</label><input type="number" id="cfgMotionSensitivity" min="1000" max="50000"></div>
          <div><label>أيام الاحتفاظ</label><input type="number" id="cfgMaxDays" min="1" max="90"></div>
          <div><label>جودة الصورة (1-100)</label><input type="number" id="cfgJpegQuality" min="10" max="100"></div>
          <div><label>بداية الجدول (ساعة)</label><input type="number" id="cfgScheduleStart" min="0" max="23"></div>
          <div><label>نهاية الجدول (ساعة)</label><input type="number" id="cfgScheduleEnd" min="1" max="24"></div>
        </div>
      </div>
      <div class="form-section">
        <h3>إشعارات تيليجرام</h3>
        <div class="form-group">
          <div><label>تفعيل</label><select id="cfgTelegramEnabled"><option value="1">نعم</option><option value="0" selected>لا</option></select></div>
          <div><label>Bot Token</label><input id="cfgTelegramToken" placeholder="123456:ABCdef..."></div>
          <div><label>Chat ID</label><input id="cfgTelegramChatId" placeholder="-100123456789"></div>
        </div>
      </div>
      <div class="form-section">
        <h3>إشعارات الإيميل</h3>
        <div class="form-group">
          <div><label>تفعيل</label><select id="cfgEmailEnabled"><option value="1">نعم</option><option value="0" selected>لا</option></select></div>
          <div><label>SMTP Server</label><input id="cfgEmailServer" placeholder="smtp.gmail.com"></div>
          <div><label>SMTP Port</label><input type="number" id="cfgEmailPort" value="587"></div>
          <div><label>من (البريد)</label><input id="cfgEmailFrom" placeholder="you@gmail.com"></div>
          <div><label>إلى (البريد)</label><input id="cfgEmailTo" placeholder="alert@example.com"></div>
          <div><label>كلمة السر SMTP</label><input type="password" id="cfgEmailPass" placeholder="App Password"></div>
        </div>
      </div>
      <div class="form-section">
        <h3>الذكاء الاصطناعي</h3>
        <div class="form-group">
          <div><label>تحسين الصورة</label><select id="cfgAIEnhance"><option value="1">مفعل</option><option value="0">معطل</option></select></div>
          <div><label>كشف الحركة</label><select id="cfgAIMotion"><option value="1">مفعل</option><option value="0">معطل</option></select></div>
          <div><label>جودة المعالجة</label><select id="cfgAIQuality"><option value="1">خفيف (أسرع)</option><option value="2" selected>متوسط</option><option value="3">عالي (أبطأ)</option></select></div>
          <div><label>قرار المعالجة</label><select id="cfgProcessWidth"><option value="360">360p (أسرع)</option><option value="480" selected>480p</option><option value="640">640p</option></select></div>
        </div>
      </div>
      <div class="form-section">
        <h3>المستخدم</h3>
        <div class="form-group">
          <div><label>اسم المستخدم</label><input id="cfgUser" readonly style="opacity:.5"></div>
          <div><label>كلمة السر</label><input type="password" id="cfgPass" placeholder="اترك فارغًا بدون تغيير"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn-secondary" onclick="exportConfig()">📤 تصدير</button>
        <button class="btn-secondary" onclick="importConfig()">📥 استيراد</button>
      </div>
      <button class="btn-secondary" onclick="closeSettings()">إلغاء</button>
      <button class="btn-primary" onclick="saveSettings()">حفظ</button>
    </div>
  </div>
</div>

<!-- SYSTEM DASHBOARD MODAL -->
<div class="modal-overlay" id="systemModal">
  <div class="modal" style="width:500px">
    <div class="modal-header">
      <h2>📊 معلومات النظام</h2>
      <button class="close-btn" onclick="closeSystem()">✕</button>
    </div>
    <div class="modal-body" id="systemBody">
      <div style="text-align:center;color:var(--text2);padding:20px">جار التحميل...</div>
    </div>
  </div>
</div>

<script>
// ============ STATE ============
let state = {
  mode: 'live',
  layout: '2x2',
  cameras: [],
  streams: {},
  aiState: {enhance:true,motion:true,super_res:false},
  selectedCam: null,
  ptzMode: false,
  zoomLevel: 1,
  loginCookie: getCookie('auth') === '1'
};

// ============ COOKIES ============
function getCookie(n){const m=document.cookie.match('(^|; )'+n+'=([^;]*)');return m?m[2]:null}

// ============ LOGIN ============
function doLogin(e){
  e.preventDefault();
  const f=new FormData(e.target);
  fetch('/',{method:'POST',body:new URLSearchParams(f),headers:{'Content-Type':'application/x-www-form-urlencoded'}})
    .then(r=>{if(r.ok){state.loginCookie=true;initApp()}else{document.getElementById('loginError').textContent='خطأ في اسم المستخدم أو كلمة السر'}})
    .catch(()=>{document.getElementById('loginError').textContent='خطأ في الاتصال'});
  return false;
}

// ============ APP INIT ============
async function initApp(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('app').style.display='flex';
  startClock();
  await loadCameras();
  await loadAIStatus();
  renderGrid();
  renderSidebar();
  setMode('live');
  setInterval(loadCameras,3000);
  setInterval(loadAIStatus,5000);
}

// ============ CLOCK ============
function startClock(){
  function tick(){
    const d=new Date();
    document.getElementById('topClock').textContent=d.toLocaleDateString('ar-SA')+' | '+d.toLocaleTimeString('ar-SA');
  }
  tick();setInterval(tick,1000);
}

// ============ CAMERAS ============
async function loadCameras(){
  try{
    const r=await fetch('/api/cameras');
    state.cameras=await r.json();
    renderSidebar();
  }catch(e){}
}

async function loadAIStatus(){
  try{
    const r=await fetch('/api/ai/status');
    state.aiState=await r.json();
  }catch(e){}
}

// ============ GRID ============
function renderGrid(){
  const grid=document.getElementById('gridContainer');
  const layout=state.layout;
  grid.className='grid-container layout-'+layout;
  const parts=layout.split('x');
  const count=parseInt(parts[0])*parseInt(parts[1]);
  const cams=state.cameras.slice(0,count);

  if(cams.length===0){
    grid.style.display='none';
    document.getElementById('emptyState').style.display='flex';
    return;
  }

  grid.style.display='grid';
  document.getElementById('emptyState').style.display='none';
  grid.innerHTML='';

  for(let i=0;i<count;i++){
    const cam=cams[i];
    const cell=document.createElement('div');
    cell.className='cell';
    cell.dataset.id=cam?cam.id:'';
    if(cam){
      cell.innerHTML=`
        <img src="/stream/${cam.id}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" style="${cam.online?'':'display:none'}">
        <div class="offline-msg" style="${cam.online?'display:none':'display:flex'}"><span>⚠️ ${cam.name} غير متصل</span></div>
        <div class="overlay">
          <span class="cam-name">${cam.name}</span>
          <span class="rec-indicator ${cam.online?'show':''}"><span class="rec-dot"></span> تسجيل</span>
        </div>
        <span class="fps-badge">${cam.fps||0} FPS</span>
        <span class="ai-badge">✦ AI ${state.aiState.enhance?'مفعل':'معطل'}</span>
        <div class="ptz-overlay show">
          <div class="ptz-pad">
            <div class="ptz-row"><button class="ptz-btn" onclick="ptzMove(${cam.id},'up')">▲</button></div>
            <div class="ptz-row"><button class="ptz-btn" onclick="ptzMove(${cam.id},'left')">◄</button><button class="ptz-btn" onclick="ptzMove(${cam.id},'center')">●</button><button class="ptz-btn" onclick="ptzMove(${cam.id},'right')">►</button></div>
            <div class="ptz-row"><button class="ptz-btn" onclick="ptzMove(${cam.id},'down')">▼</button></div>
            <div class="ptz-row" style="margin-top:4px;border-top:1px solid var(--border);padding-top:4px">
              <button class="ptz-btn" onclick="ptzMove(${cam.id},'zoom_in')" style="font-size:12px">＋</button>
              <button class="ptz-btn" onclick="ptzMove(${cam.id},'zoom_out')" style="font-size:12px">－</button>
            </div>
          </div>
        </div>`;
    } else {
      cell.innerHTML=`<div class="offline-msg" style="display:flex"><span>⬜</span></div>`;
    }
    cell.addEventListener('click',function(e){
      if(e.target.closest('.ptz-btn')||e.target.closest('.ptz-pad')) return;
      const id=this.dataset.id;
      if(id!==''&&state.cameras.length>0){
        state.selectedCam=parseInt(id);
        renderSidebar();
      }
    });
    grid.appendChild(cell);
  }
}

function renderSidebar(){
  const list=document.getElementById('camList');
  list.innerHTML='';
  state.cameras.forEach(c=>{
    const item=document.createElement('div');
    item.className='cam-item'+(state.selectedCam===c.id?' active':'');
    item.innerHTML=`
      <span class="status-dot ${c.online?'on':'off'}"></span>
      <span class="cam-item-name">${c.name}</span>
      <span class="cam-item-info">${c.fps||0}FPS</span>`;
    item.addEventListener('click',()=>{
      state.selectedCam=c.id;
      renderSidebar();
    });
    list.appendChild(item);
  });
}

// ============ LAYOUT ============
function setLayout(l){
  state.layout=l;
  document.querySelectorAll('.layout-btn').forEach(b=>b.classList.toggle('active',b.dataset.layout===l));
  renderGrid();
}

// ============ MODE ============
function setMode(m){
  state.mode=m;
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===m));
  document.getElementById('liveTimeline').style.display=m==='live'?'block':'none';
  document.getElementById('playbackTimeline').style.display=m==='playback'?'block':'none';
  if(m==='playback') initPlayback();
}

// ============ PTZ ============
function ptzMove(camId,cmd){
  fetch('/api/ptz/'+camId+'/'+cmd).catch(()=>{});
}

// ============ SNAPSHOT ============
function takeSnapshot(){
  const cam=state.selectedCam!==null?state.selectedCam:(state.cameras[0]?state.cameras[0].id:null);
  if(cam===null) return;
  const a=document.createElement('a');
  a.href='/api/snapshot/'+cam;
  a.download='snapshot_'+cam+'_'+Date.now()+'.jpg';
  a.click();
}

// ============ FULLSCREEN ============
function toggleFullscreen(){
  if(!document.fullscreenElement) document.getElementById('cameraArea').requestFullscreen();
  else document.exitFullscreen();
}

// ============ PLAYBACK ============
function initPlayback(){
  const d=new Date();
  document.getElementById('playbackDate').value=d.toISOString().split('T')[0];
  loadPlayback();
}

async function loadPlayback(){
  const date=document.getElementById('playbackDate').value;
  try{
    const r=await fetch('/api/recordings');
    const recs=await r.json();
    const list=document.getElementById('recordingList');
    const filtered=recs.filter(r=>r.start&&r.start.startsWith(date));
    document.getElementById('playbackCount').textContent=filtered.length+' تسجيل';
    list.innerHTML='';
    if(filtered.length===0){
      list.innerHTML='<span style="font-size:12px;color:var(--text2)">لا توجد تسجيلات لهذا التاريخ</span>';
      return;
    }
    filtered.forEach(rec=>{
      const el=document.createElement('button');
      el.style.cssText='background:var(--card);border:1px solid var(--border);border-radius:4px;padding:6px 12px;margin:2px 4px;color:var(--text);font-size:11px;cursor:pointer';
      el.textContent='📹 '+rec.camera+' - '+rec.start;
      el.addEventListener('click',()=>downloadRecording(rec.file));
      list.appendChild(el);
    });
  }catch(e){}
}

function downloadRecording(file){
  const a=document.createElement('a');
  a.href='/api/download/'+encodeURIComponent(file);
  a.download=file.split('/').pop();
  a.click();
}

// ============ SETTINGS ============
function showSettings(){
  fetch('/api/config').then(r=>r.json()).then(cfg=>{
    document.getElementById('cfgRecordingMode').value=cfg.recording_mode||'motion';
    document.getElementById('cfgMotionSensitivity').value=cfg.motion_sensitivity;
    document.getElementById('cfgMaxDays').value=cfg.max_days;
    document.getElementById('cfgJpegQuality').value=cfg.jpeg_quality;
    document.getElementById('cfgScheduleStart').value=cfg.schedule_start||0;
    document.getElementById('cfgScheduleEnd').value=cfg.schedule_end||24;
    document.getElementById('cfgAIEnhance').value=cfg.ai_enhance?1:0;
    document.getElementById('cfgAIMotion').value=cfg.ai_motion?1:0;
    document.getElementById('cfgAIQuality').value=cfg.ai_quality||2;
    document.getElementById('cfgProcessWidth').value=cfg.process_width||480;
    document.getElementById('cfgTelegramEnabled').value=cfg.telegram_enabled?1:0;
    document.getElementById('cfgTelegramToken').value=cfg.telegram_bot_token||'';
    document.getElementById('cfgTelegramChatId').value=cfg.telegram_chat_id||'';
    document.getElementById('cfgEmailEnabled').value=cfg.email_enabled?1:0;
    document.getElementById('cfgEmailServer').value=cfg.email_smtp_server||'';
    document.getElementById('cfgEmailPort').value=cfg.email_smtp_port||587;
    document.getElementById('cfgEmailFrom').value=cfg.email_from||'';
    document.getElementById('cfgEmailTo').value=cfg.email_to||'';
    document.getElementById('cfgUser').value=cfg.username||'admin';

    const camDiv=document.getElementById('cameraSettings');
    camDiv.innerHTML='';
    (cfg.cameras||[]).forEach((c,i)=>{
      camDiv.innerHTML+=`
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
          <input value="${c.name}" id="camName${i}" style="flex:1;margin:0" placeholder="اسم الكاميرا">
          <input value="${c.url}" id="camUrl${i}" style="flex:2;margin:0" placeholder="RTSP URL">
          <label style="font-size:11px;white-space:nowrap">
            <input type="checkbox" id="camEnabled${i}" ${c.enabled?'checked':''}> مفعل
          </label>
        </div>`;
    });

    document.getElementById('settingsModal').classList.add('show');
  });
}

function closeSettings(){
  document.getElementById('settingsModal').classList.remove('show');
}

function saveSettings(){
  const cameras=[];
  const count=document.querySelectorAll('#cameraSettings input[id^="camName"]').length;
  for(let i=0;i<count;i++){
    cameras.push({
      name:document.getElementById('camName'+i).value,
      url:document.getElementById('camUrl'+i).value,
      enabled:document.getElementById('camEnabled'+i).checked
    });
  }
  const body={
    cameras,
    recording_mode:document.getElementById('cfgRecordingMode').value,
    motion_sensitivity:parseInt(document.getElementById('cfgMotionSensitivity').value),
    max_days:parseInt(document.getElementById('cfgMaxDays').value),
    jpeg_quality:parseInt(document.getElementById('cfgJpegQuality').value),
    schedule_start:parseInt(document.getElementById('cfgScheduleStart').value),
    schedule_end:parseInt(document.getElementById('cfgScheduleEnd').value),
    ai_enhance:document.getElementById('cfgAIEnhance').value==='1',
    ai_motion:document.getElementById('cfgAIMotion').value==='1',
    ai_quality:parseInt(document.getElementById('cfgAIQuality').value),
    process_width:parseInt(document.getElementById('cfgProcessWidth').value),
    telegram_enabled:document.getElementById('cfgTelegramEnabled').value==='1',
    telegram_bot_token:document.getElementById('cfgTelegramToken').value,
    telegram_chat_id:document.getElementById('cfgTelegramChatId').value,
    email_enabled:document.getElementById('cfgEmailEnabled').value==='1',
    email_smtp_server:document.getElementById('cfgEmailServer').value,
    email_smtp_port:parseInt(document.getElementById('cfgEmailPort').value),
    email_from:document.getElementById('cfgEmailFrom').value,
    email_to:document.getElementById('cfgEmailTo').value,
    email_password:document.getElementById('cfgEmailPass').value,
    password:document.getElementById('cfgPass').value
  };
  fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(d=>{
      if(d.ok){closeSettings();loadCameras();}
    });
}

// ============ SYSTEM ============
async function showSystem(){
  document.getElementById('systemModal').classList.add('show');
  document.getElementById('systemBody').innerHTML='<div style="text-align:center;color:var(--text2);padding:20px">جار التحميل...</div>';
  try{
    const r=await fetch('/api/system');
    const d=await r.json();
    document.getElementById('systemBody').innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="sys-card"><div class="sys-label">⏱ مدة التشغيل</div><div class="sys-val">${d.uptime_str}</div></div>
        <div class="sys-card"><div class="sys-label">📹 التسجيلات</div><div class="sys-val">${d.recordings_count}</div></div>
        <div class="sys-card"><div class="sys-label">💾 حجم التسجيلات</div><div class="sys-val">${d.recordings_size_str}</div></div>
        <div class="sys-card"><div class="sys-label">💿 القرص</div><div class="sys-val">${d.disk_free_str} / ${d.disk_total_str}</div></div>
        <div class="sys-card" style="grid-column:1/-1"><div class="sys-label">استخدام القرص</div>
          <div style="background:var(--bg);border-radius:10px;height:20px;overflow:hidden;margin-top:6px">
            <div style="background:linear-gradient(90deg,var(--accent2),${d.disk_percent>80?'var(--red)':'var(--accent)'});width:${d.disk_percent}%;height:100%;border-radius:10px;transition:width 1s"></div>
          </div>
          <div style="text-align:center;font-size:11px;color:var(--text2);margin-top:4px">${d.disk_percent}% مستخدم</div>
        </div>
      </div>
      <style>
        .sys-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
        .sys-label{font-size:11px;color:var(--text2);margin-bottom:4px}
        .sys-val{font-size:18px;font-weight:600;color:var(--accent)}
      </style>`;
  }catch(e){
    document.getElementById('systemBody').innerHTML='<div style="color:var(--red);text-align:center;padding:20px">خطأ في تحميل المعلومات</div>';
  }
}
function closeSystem(){document.getElementById('systemModal').classList.remove('show')}

// ============ DIGITAL ZOOM ============
document.addEventListener('wheel',function(e){
  const cell=e.target.closest('.cell');
  if(!cell||!e.ctrlKey)return;
  e.preventDefault();
  const img=cell.querySelector('img');
  if(!img)return;
  state.zoomLevel=Math.max(1,Math.min(5,state.zoomLevel+(e.deltaY>0?-0.1:0.1)));
  img.style.transform='scale('+state.zoomLevel+')';
  img.style.transformOrigin='center center';
  img.style.transition='transform 0.1s';
},{passive:false});

// ============ EXPORT/IMPORT ============
async function exportConfig(){
  const r=await fetch('/api/config/export');
  const d=await r.json();
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='dvr_config_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importConfig(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json';
  inp.onchange=async function(){
    try{
      const text=await inp.files[0].text();
      const data=JSON.parse(text);
      const r=await fetch('/api/config/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
      const d=await r.json();
      if(d.ok) showSettings();
      else alert('فشل الاستيراد');
    }catch(e){alert('ملف غير صحيح');}
  };
  inp.click();
}

// ============ DIGITAL ZOOM ============
document.addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F') toggleFullscreen();
  if(e.key>='1'&&e.key<='4') setLayout('1x1');
});

// ============ INIT CHECK ============
if(state.loginCookie) initApp();
</script>
</body>
</html>
